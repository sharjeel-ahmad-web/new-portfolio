<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient for the outer ring (Blue to Purple) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b40ff" />
      <stop offset="50%" stop-color="#5530ff" />
      <stop offset="100%" stop-color="#9d30ff" />
    </linearGradient>
  </defs>
  
  <!-- Dark Navy Background -->
  <rect width="100%" height="100%" fill="#0d1017" />
  
  <!-- Gradient Ring -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="16" />
  
  <!-- Initials "SA" -->
  <text 
    x="250" 
    y="280" 
    font-family="'Arial Black', Impact, sans-serif" 
    font-size="160" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="-2">
    SA
  </text>
  
  <!-- Left Purple Dot -->
  <circle cx="115" cy="225" r="9" fill="#8c3dff" />
  
  <!-- Right Purple Dot -->
  <circle cx="385" cy="225" r="9" fill="#8c3dff" />
  
  <!-- Full Name -->
  <text 
    x="254" 
    y="360" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="21" 
    fill="#c4c6cc" 
    text-anchor="middle" 
    letter-spacing="5">
    SHARJEEL AHMAD
  </text>
</svg>
